<svg id="tf-ticketflow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="tfIcon_20260429_title tfIcon_20260429_desc">
  <title id="tfIcon_20260429_title">Ticketflow animated brand loader</title>
  <desc id="tfIcon_20260429_desc">Icono animado de Ticketflow con símbolo geométrico, tarjetas de tickets y líneas de flujo.</desc>

  <defs>
    <!-- Todos los ids, keyframes y clases están namespaced para no afectar a otros SVG inline. -->
    <style>

      .tfIcon_20260429_origin_center { transform-box: fill-box; transform-origin: center; }
      .tfIcon_20260429_origin_left { transform-box: fill-box; transform-origin: left center; }

      #tfIcon_20260429_brand-orb { animation: tfIcon_20260429_orbPulse 3.4s ease-in-out infinite; }
      #tfIcon_20260429_ticket-left { animation: tfIcon_20260429_floatLeft 4.8s ease-in-out infinite; }
      #tfIcon_20260429_ticket-right { animation: tfIcon_20260429_floatRight 5.2s ease-in-out infinite; }
      #tfIcon_20260429_ticket-bottom { animation: tfIcon_20260429_floatBottom 4.4s ease-in-out infinite; }
      #tfIcon_20260429_logo-mark { animation: tfIcon_20260429_markBreathe 2.8s ease-in-out infinite; }
      #tfIcon_20260429_logo-shine { animation: tfIcon_20260429_shineSweep 2.9s ease-in-out infinite; }
      #tfIcon_20260429_ring-a { animation: tfIcon_20260429_ringSpin 16s linear infinite; transform-origin: 256px 240px; }
      #tfIcon_20260429_ring-b { animation: tfIcon_20260429_ringSpinReverse 22s linear infinite; transform-origin: 256px 240px; }
      #tfIcon_20260429_status-dot-a, #tfIcon_20260429_status-dot-c { animation: tfIcon_20260429_dotPulse 1.35s ease-in-out infinite; }
      #tfIcon_20260429_status-dot-b { animation: tfIcon_20260429_dotPulse 1.35s ease-in-out .25s infinite; }
      #tfIcon_20260429_node-1 { animation: tfIcon_20260429_nodeGlow 1.6s ease-in-out infinite; }
      #tfIcon_20260429_node-2 { animation: tfIcon_20260429_nodeGlow 1.6s ease-in-out .25s infinite; }
      #tfIcon_20260429_node-3 { animation: tfIcon_20260429_nodeGlow 1.6s ease-in-out .5s infinite; }
      #tfIcon_20260429_bar-1 { animation: tfIcon_20260429_barLoad 2.4s ease-in-out infinite; }
      #tfIcon_20260429_bar-2 { animation: tfIcon_20260429_barLoad 2.4s ease-in-out .22s infinite; }
      #tfIcon_20260429_bar-3 { animation: tfIcon_20260429_barLoad 2.4s ease-in-out .44s infinite; }
      #tfIcon_20260429_flow-a, #tfIcon_20260429_flow-b, #tfIcon_20260429_flow-c, #tfIcon_20260429_mark-flow { animation: tfIcon_20260429_dashFlow 2.1s linear infinite; }
      #tfIcon_20260429_checkmark { stroke-dasharray: 56; stroke-dashoffset: 56; animation: tfIcon_20260429_drawCheck 2.6s ease-in-out infinite; }
      #tfIcon_20260429_spark-1 { animation: tfIcon_20260429_spark 2.1s ease-in-out infinite; }
      #tfIcon_20260429_spark-2 { animation: tfIcon_20260429_spark 2.1s ease-in-out .35s infinite; }
      #tfIcon_20260429_spark-3 { animation: tfIcon_20260429_spark 2.1s ease-in-out .7s infinite; }

      @keyframes tfIcon_20260429_orbPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.018); opacity: .96; }
      }
      @keyframes tfIcon_20260429_floatLeft {
        0%, 100% { transform: translate(0, 0) rotate(-5deg); }
        50% { transform: translate(0, -9px) rotate(-3deg); }
      }
      @keyframes tfIcon_20260429_floatRight {
        0%, 100% { transform: translate(0, 0) rotate(5deg); }
        50% { transform: translate(0, -11px) rotate(3deg); }
      }
      @keyframes tfIcon_20260429_floatBottom {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes tfIcon_20260429_markBreathe {
        0%, 100% { transform: scale(1); filter: url(#tfIcon_20260429_brandGlow); }
        50% { transform: scale(1.025); filter: url(#tfIcon_20260429_brandGlowStrong); }
      }
      @keyframes tfIcon_20260429_shineSweep {
        0% { transform: translateX(-170px) rotate(-18deg); opacity: 0; }
        18% { opacity: .55; }
        45% { opacity: .15; }
        100% { transform: translateX(190px) rotate(-18deg); opacity: 0; }
      }
      @keyframes tfIcon_20260429_ringSpin { to { transform: rotate(360deg); } }
      @keyframes tfIcon_20260429_ringSpinReverse { to { transform: rotate(-360deg); } }
      @keyframes tfIcon_20260429_dotPulse {
        0%, 100% { transform: scale(1); opacity: .55; }
        50% { transform: scale(1.45); opacity: 1; }
      }
      @keyframes tfIcon_20260429_nodeGlow {
        0%, 100% { transform: scale(1); opacity: .72; }
        50% { transform: scale(1.18); opacity: 1; }
      }
      @keyframes tfIcon_20260429_barLoad {
        0%, 100% { transform: scaleX(.38); opacity: .55; }
        50% { transform: scaleX(1); opacity: 1; }
      }
      @keyframes tfIcon_20260429_dashFlow { to { stroke-dashoffset: -96; } }
      @keyframes tfIcon_20260429_drawCheck {
        0%, 32% { stroke-dashoffset: 56; opacity: .35; }
        46%, 82% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -56; opacity: .35; }
      }
      @keyframes tfIcon_20260429_spark {
        0%, 100% { transform: scale(.7); opacity: .2; }
        50% { transform: scale(1.3); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #tf-ticketflow-icon, #tf-ticketflow-icon *, #tf-ticketflow-icon *::before, #tf-ticketflow-icon *::after {
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
        }
      }
    </style>

    <clipPath id="tfIcon_20260429_appClip">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>

    <linearGradient id="tfIcon_20260429_bgGrad" x1="52" y1="30" x2="470" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A347DB"/>
      <stop offset=".44" stop-color="#973DD3"/>
      <stop offset="1" stop-color="#6E2BC0"/>
    </linearGradient>

    <radialGradient id="tfIcon_20260429_radialGlow" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#E386FF" stop-opacity=".32"/>
      <stop offset=".44" stop-color="#9846DE" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3C1377" stop-opacity=".34"/>
    </radialGradient>

    <linearGradient id="tfIcon_20260429_cyanStroke" x1="126" y1="100" x2="380" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58D8F7"/>
      <stop offset=".52" stop-color="#43B8EF"/>
      <stop offset="1" stop-color="#2C72CA"/>
    </linearGradient>

    <linearGradient id="tfIcon_20260429_blueStroke" x1="160" y1="150" x2="360" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4EC9F5"/>
      <stop offset=".55" stop-color="#2E89D9"/>
      <stop offset="1" stop-color="#255BAE"/>
    </linearGradient>

    <linearGradient id="tfIcon_20260429_magentaStroke" x1="152" y1="244" x2="362" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65D8F6"/>
      <stop offset=".48" stop-color="#7B78E9"/>
      <stop offset="1" stop-color="#CF4EE9"/>
    </linearGradient>

    <linearGradient id="tfIcon_20260429_cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>

    <linearGradient id="tfIcon_20260429_flowGrad" x1="58" y1="151" x2="454" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#52D4F6" stop-opacity=".08"/>
      <stop offset=".45" stop-color="#52D4F6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#D34CEC" stop-opacity=".08"/>
    </linearGradient>

    <filter id="tfIcon_20260429_softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#34125F" flood-opacity=".36"/>
    </filter>

    <filter id="tfIcon_20260429_cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B0B56" flood-opacity=".28"/>
    </filter>

    <filter id="tfIcon_20260429_brandGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4DC5F4" flood-opacity=".35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#B84DDF" flood-opacity=".24"/>
    </filter>

    <filter id="tfIcon_20260429_brandGlowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#4DC5F4" flood-opacity=".55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#B84DDF" flood-opacity=".36"/>
    </filter>

    <filter id="tfIcon_20260429_tinyGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4DC5F4" flood-opacity=".85"/>
    </filter>

    <path id="tfIcon_20260429_particlePathA" d="M84 220 C132 148 198 128 256 126 C322 124 381 151 428 214"/>
    <path id="tfIcon_20260429_particlePathB" d="M92 312 C145 372 210 394 278 372 C340 352 386 314 430 258"/>
    <path id="tfIcon_20260429_particlePathC" d="M165 397 C188 344 215 318 256 306 C304 292 350 304 393 352"/>
  </defs>

  <g clip-path="url(#tfIcon_20260429_appClip)">
    <rect width="512" height="512" fill="url(#tfIcon_20260429_bgGrad)"/>
    <rect width="512" height="512" fill="url(#tfIcon_20260429_radialGlow)"/>

    <!-- Textura geométrica sutil inspirada en el símbolo de Ticketflow -->
    <g opacity=".13" stroke="#FFFFFF" stroke-width="1.4" fill="none">
      <path d="M-20 128 L100 58 L220 128 L220 268 L100 338 L-20 268 Z"/>
      <path d="M304 -12 L424 58 L544 -12"/>
      <path d="M330 428 L450 358 L570 428"/>
      <path d="M-8 438 L112 508 L232 438"/>
    </g>

    <!-- Líneas de flujo -->
    <g fill="none" stroke-linecap="round">
      <path d="M70 218 C124 146 192 120 256 120 C326 120 386 150 442 220" stroke="url(#tfIcon_20260429_flowGrad)" stroke-width="2.5" opacity=".45"/>
      <path id="tfIcon_20260429_flow-a" d="M70 218 C124 146 192 120 256 120 C326 120 386 150 442 220" stroke="#4DC5F4" stroke-width="3" stroke-dasharray="18 78" stroke-dashoffset="0" opacity=".55"/>

      <path d="M72 310 C135 378 202 396 276 374 C338 356 389 315 442 252" stroke="url(#tfIcon_20260429_flowGrad)" stroke-width="2.5" opacity=".38"/>
      <path id="tfIcon_20260429_flow-b" d="M72 310 C135 378 202 396 276 374 C338 356 389 315 442 252" stroke="#D34CEC" stroke-width="3" stroke-dasharray="14 82" stroke-dashoffset="20" opacity=".48"/>

      <path id="tfIcon_20260429_flow-c" d="M162 398 C194 338 221 316 256 306 C301 293 350 304 394 354" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 64" stroke-dashoffset="10" opacity=".34"/>
    </g>

    <!-- Tarjeta de ticket izquierda -->
    <g id="tfIcon_20260429_ticket-left" class="tfIcon_20260429_origin_center" filter="url(#tfIcon_20260429_cardShadow)">
      <rect x="54" y="174" width="126" height="154" rx="26" fill="url(#tfIcon_20260429_cardGrad)" stroke="#FFFFFF" stroke-opacity=".26"/>
      <rect x="70" y="193" width="54" height="10" rx="5" fill="#4DC5F4" opacity=".95"/>
      <rect x="132" y="193" width="24" height="10" rx="5" fill="#FFFFFF" opacity=".28"/>
      <rect x="70" y="222" width="78" height="8" rx="4" fill="#FFFFFF" opacity=".46"/>
      <rect x="70" y="240" width="92" height="8" rx="4" fill="#FFFFFF" opacity=".28"/>
      <rect x="70" y="258" width="62" height="8" rx="4" fill="#FFFFFF" opacity=".28"/>
      <g transform="translate(72 286)">
        <circle id="tfIcon_20260429_status-dot-a" class="tfIcon_20260429_origin_center" cx="7" cy="7" r="7" fill="#4DC5F4" filter="url(#tfIcon_20260429_tinyGlow)"/>
        <rect x="23" y="2" width="66" height="10" rx="5" fill="#FFFFFF" opacity=".28"/>
      </g>
      <rect x="54" y="174" width="7" height="154" rx="3.5" fill="#4DC5F4" opacity=".95"/>
    </g>

    <!-- Tarjeta de ticket derecha -->
    <g id="tfIcon_20260429_ticket-right" class="tfIcon_20260429_origin_center" filter="url(#tfIcon_20260429_cardShadow)">
      <rect x="332" y="162" width="128" height="162" rx="28" fill="url(#tfIcon_20260429_cardGrad)" stroke="#FFFFFF" stroke-opacity=".24"/>
      <rect x="352" y="184" width="58" height="10" rx="5" fill="#D65AF0" opacity=".86"/>
      <rect x="418" y="184" width="20" height="10" rx="5" fill="#FFFFFF" opacity=".25"/>
      <rect x="352" y="218" width="84" height="8" rx="4" fill="#FFFFFF" opacity=".26"/>
      <rect id="tfIcon_20260429_bar-1" class="tfIcon_20260429_origin_left" x="352" y="238" width="70" height="8" rx="4" fill="#4DC5F4" opacity=".9"/>
      <rect id="tfIcon_20260429_bar-2" class="tfIcon_20260429_origin_left" x="352" y="256" width="86" height="8" rx="4" fill="#FFFFFF" opacity=".42"/>
      <rect id="tfIcon_20260429_bar-3" class="tfIcon_20260429_origin_left" x="352" y="274" width="52" height="8" rx="4" fill="#D65AF0" opacity=".8"/>
      <g transform="translate(354 295)">
        <circle id="tfIcon_20260429_status-dot-b" class="tfIcon_20260429_origin_center" cx="7" cy="7" r="7" fill="#D65AF0" filter="url(#tfIcon_20260429_tinyGlow)"/>
        <rect x="23" y="2" width="54" height="10" rx="5" fill="#FFFFFF" opacity=".28"/>
      </g>
    </g>

    <!-- Orb central -->
    <g id="tfIcon_20260429_brand-orb" class="tfIcon_20260429_origin_center" filter="url(#tfIcon_20260429_softShadow)">
      <circle cx="256" cy="240" r="143" fill="#7E33C6" opacity=".38"/>
      <circle cx="256" cy="240" r="116" fill="#FFFFFF" opacity=".10" stroke="#FFFFFF" stroke-opacity=".23"/>
      <circle cx="256" cy="240" r="84" fill="#6F2DC0" opacity=".25"/>
    </g>

    <!-- Anillos decorativos -->
    <g fill="none" stroke-linecap="round" opacity=".65">
      <circle id="tfIcon_20260429_ring-a" cx="256" cy="240" r="130" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="2" stroke-dasharray="32 48"/>
      <circle id="tfIcon_20260429_ring-b" cx="256" cy="240" r="102" stroke="#4DC5F4" stroke-opacity=".24" stroke-width="2" stroke-dasharray="18 60"/>
    </g>

    <!-- Marca Ticketflow reinterpretada -->
    <g id="tfIcon_20260429_logo-mark" class="tfIcon_20260429_origin_center">
      <g filter="url(#tfIcon_20260429_brandGlow)">
        <path d="M163 176 L256 122 L349 176 L349 230" fill="none" stroke="url(#tfIcon_20260429_cyanStroke)" stroke-width="30" stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M163 176 L163 254 L256 308 L349 254" fill="none" stroke="url(#tfIcon_20260429_blueStroke)" stroke-width="30" stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M163 254 L256 200 L349 254" fill="none" stroke="url(#tfIcon_20260429_magentaStroke)" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter" opacity=".95"/>

        <!-- Corte interior para mantener el look de ribbon del logo -->
        <path d="M202 198 L256 166 L310 198" fill="none" stroke="#973DD3" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter" opacity=".95"/>
        <path d="M202 232 L256 264 L310 232" fill="none" stroke="#973DD3" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter" opacity=".95"/>

        <!-- Flujo luminoso sobre la marca -->
        <path id="tfIcon_20260429_mark-flow" d="M163 176 L256 122 L349 176 L349 230 M163 176 L163 254 L256 308 L349 254 M163 254 L256 200 L349 254" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="42 130" stroke-dashoffset="0" opacity=".55"/>
      </g>

      <clipPath id="tfIcon_20260429_shineClip">
        <path d="M139 88 H373 V326 H139 Z"/>
      </clipPath>
      <g clip-path="url(#tfIcon_20260429_shineClip)">
        <rect id="tfIcon_20260429_logo-shine" x="210" y="94" width="36" height="254" rx="18" fill="#FFFFFF" opacity=".0"/>
      </g>
    </g>

    <!-- Partículas de flujo -->
    <g filter="url(#tfIcon_20260429_tinyGlow)">
      <circle r="4.8" fill="#4DC5F4">
        <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
          <mpath href="#tfIcon_20260429_particlePathA"/>
        </animateMotion>
      </circle>
      <circle r="3.8" fill="#D65AF0">
        <animateMotion dur="3.6s" begin=".4s" repeatCount="indefinite" rotate="auto">
          <mpath href="#tfIcon_20260429_particlePathB"/>
        </animateMotion>
      </circle>
      <circle r="3.2" fill="#FFFFFF" opacity=".85">
        <animateMotion dur="2.8s" begin=".7s" repeatCount="indefinite" rotate="auto">
          <mpath href="#tfIcon_20260429_particlePathC"/>
        </animateMotion>
      </circle>
    </g>

    <!-- Ticket inferior / estado resuelto -->
    <g id="tfIcon_20260429_ticket-bottom" class="tfIcon_20260429_origin_center" filter="url(#tfIcon_20260429_cardShadow)">
      <rect x="158" y="372" width="196" height="64" rx="24" fill="#FFFFFF" opacity=".14" stroke="#FFFFFF" stroke-opacity=".22"/>
      <circle id="tfIcon_20260429_node-1" class="tfIcon_20260429_origin_center" cx="190" cy="404" r="11" fill="#4DC5F4" filter="url(#tfIcon_20260429_tinyGlow)"/>
      <path d="M185 404 L189 408 L197 398" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="214" y="393" width="84" height="8" rx="4" fill="#FFFFFF" opacity=".36"/>
      <rect x="214" y="411" width="55" height="7" rx="3.5" fill="#FFFFFF" opacity=".22"/>
      <g transform="translate(318 392)">
        <circle id="tfIcon_20260429_node-2" class="tfIcon_20260429_origin_center" cx="14" cy="14" r="14" fill="#FFFFFF" opacity=".13"/>
        <path id="tfIcon_20260429_checkmark" d="M7 14 L12 19 L23 8" fill="none" stroke="#4DC5F4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Nodos de workflow -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="2">
      <path d="M116 382 C144 354 172 342 206 350"/>
      <path d="M396 374 C374 350 344 340 306 348"/>
    </g>
    <g filter="url(#tfIcon_20260429_tinyGlow)">
      <circle id="tfIcon_20260429_node-3" class="tfIcon_20260429_origin_center" cx="118" cy="381" r="6" fill="#4DC5F4"/>
      <circle id="tfIcon_20260429_spark-1" class="tfIcon_20260429_origin_center" cx="424" cy="132" r="4" fill="#FFFFFF" opacity=".8"/>
      <circle id="tfIcon_20260429_spark-2" class="tfIcon_20260429_origin_center" cx="88" cy="134" r="3.5" fill="#4DC5F4" opacity=".8"/>
      <circle id="tfIcon_20260429_spark-3" class="tfIcon_20260429_origin_center" cx="434" cy="364" r="3.5" fill="#D65AF0" opacity=".8"/>
    </g>

    <!-- Etiqueta pequeña, sin romper el uso como icono -->
    <g opacity=".92">
      <rect x="174" y="454" width="164" height="28" rx="14" fill="#47148E" opacity=".34"/>
      <circle id="tfIcon_20260429_status-dot-c" class="tfIcon_20260429_origin_center" cx="196" cy="468" r="5" fill="#4DC5F4" filter="url(#tfIcon_20260429_tinyGlow)"/>
      <text x="256" y="473" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1.7">TICKETFLOW</text>
    </g>
  </g>
</svg>
