{% extends base_template %}
{% load static %}

{% block title %}TicketFlow – Perfil{% endblock %}

{% block extra_css %}
{% endblock %}

{% block content %}
<div id="ticket-preview-card">
    <div class="tpc-header">
        <span class="tpc-status"></span>
        <span class="tpc-subject"></span>
        <span class="tpc-priority"></span>
    </div>
    <div class="tpc-desc"></div>
    <div class="tpc-comment-section">
        <div class="tpc-comment-label">Último comentario</div>
        <div class="tpc-comment-meta">
            <span class="tpc-comment-author"></span>
            <span class="tpc-comment-date"></span>
        </div>
        <div class="tpc-comment-body"></div>
    </div>
</div>
{% include 'tickets/_workspace_profile.html' %}

<script>
    // ---- Subject hover preview ----
    (function() {
        const card = document.getElementById("ticket-preview-card");
        if (!card) return;
        let _timer = null, _mx = 0, _my = 0;

        function _positionCard() {
            const cw = card.offsetWidth, ch = card.offsetHeight, m = 16;
            let x = _mx + 14, y = _my + 14;
            if (x + cw + m > window.innerWidth)  x = _mx - cw - 14;
            if (y + ch + m > window.innerHeight) y = _my - ch - 14;
            card.style.left = Math.max(0, x) + "px";
            card.style.top  = Math.max(0, y) + "px";
        }

        function _showCard(span) {
            const s = span.dataset;
            card.querySelector(".tpc-status").textContent = s.status || '';
            card.querySelector(".tpc-status").className = "tpc-status status-" + (s.status || '').toLowerCase();
            card.querySelector(".tpc-subject").textContent = s.subject || '';
            card.querySelector(".tpc-priority").textContent = s.priority ? "(" + s.priority + ")" : "";
            card.querySelector(".tpc-desc").textContent = s.description || "";
            const hasComment = s.lcBody && s.lcBody.trim();
            card.querySelector(".tpc-comment-section").style.display = hasComment ? "" : "none";
            if (hasComment) {
                card.querySelector(".tpc-comment-author").textContent = s.lcAuthor || '';
                card.querySelector(".tpc-comment-date").textContent = s.lcDate || '';
                const body = card.querySelector(".tpc-comment-body");
                body.textContent = s.lcBody || '';
                body.classList.toggle("is-internal", !!s.lcInternal);
            }
            card.style.display = "block";
            _positionCard();
        }

        document.addEventListener("mousemove", function(e) {
            _mx = e.clientX; _my = e.clientY;
            if (card.style.display === "block") _positionCard();
        });

        function _attachHover(span) {
            span.addEventListener("mouseenter", function() {
                clearTimeout(_timer);
                _timer = setTimeout(() => _showCard(span), 250);
            });
            span.addEventListener("mouseleave", function() {
                clearTimeout(_timer);
                card.style.display = "none";
            });
        }

        // Expuesto para que _profile_tickets.html reenganche el hover en las filas
        // que llegan por AJAX al filtrar o paginar (son nodos nuevos).
        window.__tfProfileHoverAttach = function (root) {
            (root || document).querySelectorAll(".subject-text").forEach(_attachHover);
        };
        window.__tfProfileHoverAttach();
    })();

    function openTicket(ticketId, subject) {
        const tabText = subject || "Ticket " + ticketId;
        const tabUrl = "{% url 'create_ticket' %}?id=" + ticketId;
        if (window.Tabs && typeof window.Tabs.addTab === 'function') {
            window.Tabs.addTab(tabText, tabUrl);
        } else {
            window.location.href = tabUrl;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const menuItems = document.querySelectorAll("#profileMenu li");
        const sections = document.querySelectorAll(".profile-section");

        menuItems.forEach(item => {
            item.addEventListener("click", () => {
                // reset
                menuItems.forEach(i => i.classList.remove("active"));
                sections.forEach(s => s.style.display = "none");

                // activar
                item.classList.add("active");
                const target = document.getElementById(item.dataset.section);
                if (target) target.style.display = "block";
            });
        });
    });
</script>
{% endblock %}
