<div class="sidebar-navigation">
    <img src="{% static 'tickets/logo.png' %}" alt="Logo">
    <ul>
        <li>
            <a href="{% url 'home' %}">
                <i class="fas fa-home"></i>
                <span class="tooltip">Dashboard</span>
            </a>
        </li>
        <li>
            <a href="{% url 'tickets_list' %}">
                <i class="fas fa-list"></i>
                <span class="tooltip">Vistas</span>
            </a>
        </li>
        {% if user.role and user.role.role_name|lower != 'end user' and user.role.role_name|lower != 'end-user' and user.role.role_name|lower != 'cliente' and user.role.role_name|lower != 'customer' %}
        <li>
            <a href="{% url 'customers_list' %}">
                <i class="fas fa-users"></i>
                <span class="tooltip">Clientes</span>
            </a>
        </li>
        {% endif %}
        <li>
            <a href="{% url 'reporting' %}">
                <i class="fas fa-chart-bar"></i>
                <span class="tooltip">Reportes</span>
            </a>
        </li>
    </ul>
</div>
<nav class="navbar">
    <div class="navbar-left">
        <button class="add-tab">+ Añadir</button>
    </div>
    <div class="navbar-center">
        <input type="text" class="search-bar" placeholder="Buscar...">
    </div>
    <div class="navbar-right">
        <button class="notifications">
            <span class="icon">🔔</span>
            <span class="badge">3</span>
        </button>
        <div class="user-profile">
            <img src="{% static 'tickets/profile-pic.png' %}" alt="Perfil" class="profile-picture">
            <span class="username">Usuario</span>
        </div>
    </div>
</nav>
