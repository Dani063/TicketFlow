{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - TicketFlow</title>
    <link rel="stylesheet" type="text/css" href="{% static 'tickets/login.css' %}">
    <link rel="stylesheet" href="{% static 'tickets/toast.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.6/lottie.min.js"></script>
    <script src="{% static 'tickets/toast.js' %}"></script>
</head>
<body>
    <section class="forms-section">
        <h1 class="section-title">TicketFlow</h1>
        <div id="lottie-animation" style="width: 300px; height: 300px; margin: 0 auto;"></div>
        <div class="forms">
            <div class="form-wrapper is-active">
                <button type="button" class="switcher switcher-login">
                    Iniciar sesión
                    <span class="underline"></span>
                </button>
                <form class="form form-login" id="login-form">
                    <fieldset>
                        <legend>Ingresa tu correo y contraseña para iniciar sesión.</legend>
                        <div class="input-block">
                            <label for="login-email">Correo electrónico</label>
                            <input id="login-email" type="email" required>
                        </div>
                        <div class="input-block">
                            <label for="login-password">Contraseña</label>
                            <input id="login-password" type="password" required>
                        </div>
                    </fieldset>
                    <button type="submit" class="btn-login">Iniciar sesión</button>
                </form>
            </div>
            <div class="form-wrapper">
                <button type="button" class="switcher switcher-signup">
                    Crear cuenta
                    <span class="underline"></span>
                </button>
                <form class="form form-signup" id="signup-form">
                    <fieldset>
                        <legend>Ingresa tu correo, nombre, contraseña y confirmación de contraseña para crear una cuenta.</legend>
                        <div class="input-block">
                            <label for="signup-email">Correo electrónico</label>
                            <input id="signup-email" type="email" required>
                        </div>
                        <div class="input-block">
                            <label for="signup-name">Nombre</label>
                            <input id="signup-name" type="text" required>
                        </div>
                        <div class="input-block">
                            <label for="signup-password">Contraseña</label>
                            <input id="signup-password" type="password" required>
                        </div>
                        <div class="input-block">
                            <label for="signup-password-confirm">Confirmar contraseña</label>
                            <input id="signup-password-confirm" type="password" required>
                        </div>
                    </fieldset>
                    <button type="submit" class="btn-signup">Continuar</button>
                </form>
            </div>
        </div>
    </section>
    <script>
        const switchers = [...document.querySelectorAll('.switcher')]

        switchers.forEach(item => {
            item.addEventListener('click', function () {
                switchers.forEach(item => item.parentElement.classList.remove('is-active'))
                this.parentElement.classList.add('is-active')
            })
        })

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const name = document.getElementById('signup-name').value;
            const password = document.getElementById('signup-password').value;
            const passwordConfirm = document.getElementById('signup-password-confirm').value;

            if (password !== passwordConfirm) {
                window.toast.warning('Las contraseñas no coinciden');
                return;
            }

            const response = await fetch('/api/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ email, name, password })
            });

            const data = await response.json();
            if (response.ok) {
                window.toast.success(data.message || 'Cuenta creada con éxito');
                document.querySelector('.switcher-login').click();
            } else {
                window.toast.error(data.error || 'No se pudo crear la cuenta');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const response = await fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (response.ok) {
                window.toast.success('Bienvenido', { duration: 1200 });
                setTimeout(() => { window.location.href = '/'; }, 600);
            } else {
                window.toast.error(data.error || 'No se pudo iniciar sesión');
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        // Inicializar la animación de Lottie
        const animation = lottie.loadAnimation({
            container: document.getElementById('lottie-animation'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: '{% static "tickets/Animation - 1738849719549.json" %}'
        });
    </script>
</body>
</html>
