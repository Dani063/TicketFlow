apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketflow-beat
spec:
  replicas: 1             # NUNCA más de 1 — Celery beat no es distribuido
  strategy:
    type: Recreate        # Matar el pod viejo antes de crear el nuevo
  selector:
    matchLabels:
      app: ticketflow
      role: beat
  template:
    metadata:
      labels:
        app: ticketflow
        role: beat
    spec:
      containers:
        - name: beat
          image: ticketflow:latest           # ← actualizar con tu registry/tag
          env:
            - name: PYTHON_ARGS
              value: "celery_beat"
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: ticketflow-secrets
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "find /tmp/celerybeat-schedule -mmin -5 | grep -q celerybeat"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "test -f /tmp/celerybeat-schedule"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
