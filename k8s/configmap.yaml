apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketflow-config
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "ticketflow.example.com"           # ← cambiar al dominio real
  CSRF_TRUSTED_ORIGINS: "https://ticketflow.example.com"
  DB_NAME: "ticketflow"
  DB_PORT: "3306"
  # URL completa de la cola SQS — debe existir previamente, el pod NO tiene permiso de crearla.
  # Formato: https://sqs.{region}.amazonaws.com/{account_id}/{queue_name}
  CELERY_SQS_QUEUE_URL: "https://sqs.eu-west-1.amazonaws.com/ACCOUNT_ID/ticketflow-celery"  # ← cambiar
  AWS_SSM_PREFIX: "/Recordia/Development/Ticketflow"
  AWS_REGION: "eu-west-1"
  SSO_LOGIN_API_URL: "https://dev-login-api.agentia365.com"
  SSO_LOGIN_UI_URL: "https://dev-login.recordia.net"
  # Azure, Zendesk y SECRET_KEY vienen de SSM — no van aquí
