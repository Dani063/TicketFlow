apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketflow-config
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "ticketflow.example.com,support.ecomfax.com,support.recordia.net"  # ← cambiar ticketflow.example.com al dominio real
  CSRF_TRUSTED_ORIGINS: "https://ticketflow.example.com,https://support.ecomfax.com,https://support.recordia.net"
  DB_NAME: "ticketflow"
  DB_PORT: "3306"
  AWS_SSM_PREFIX: "/Recordia/Development/Ticketflow"
  AWS_REGION: "eu-west-1"
  SSO_LOGIN_API_URL: "https://dev-login-api.agentia365.com"
  SSO_LOGIN_UI_URL: "https://dev-login.recordia.net"
  # Con 512 MiB por pod, dos procesos dejan margen para cálculos de reporting
  # sin que el kernel termine workers por presión de memoria.
  WEB_CONCURRENCY: "2"
  GUNICORN_TIMEOUT: "60"
  # STA: únicamente las respuestas públicas escritas por agentes salen por email.
  # Acuse de creación y encuesta permanecen explícitamente desactivados.
  OUTBOUND_EMAIL_ENABLED: "true"
  OUTBOUND_TICKET_CREATED_ENABLED: "false"
  OUTBOUND_AGENT_REPLY_ENABLED: "true"
  SATISFACTION_SURVEY_ENABLED: "false"
  PUBLIC_HELP_ENABLED: "true"
  PUBLIC_TICKET_INTAKE_ENABLED: "true"
  ECOMFAX_HELP_PUBLIC_URL: "https://support.ecomfax.com"
  RECORDIA_HELP_PUBLIC_URL: "https://support.recordia.net"
  PUBLIC_ECOMFAX_BRAND_NAME: "eComFax"
  PUBLIC_RECORDIA_BRAND_NAME: "Comunycarse Helpdesk"
  # Mantener "auto" hasta que Infra entregue bucket + rol. Al activarlo en un
  # entorno Kubernetes cambiar a "s3": así una mala configuración falla de
  # forma visible y nunca cae silenciosamente al disco efímero del pod.
  ATTACHMENT_STORAGE_BACKEND: "auto"
  ATTACHMENT_STORAGE_PREFIX: "sta"
  # PUBLIC_ATTACHMENTS_S3_BUCKET: "ticketflow-private-attachments"
  PUBLIC_ATTACHMENTS_S3_REGION: "eu-west-1"
  PUBLIC_ATTACHMENT_MAX_FILES: "5"
  PUBLIC_ATTACHMENT_MAX_BYTES: "15728640"
  PUBLIC_ATTACHMENT_MAX_TOTAL_BYTES: "26214400"
  ATTACHMENT_ORPHAN_MAX_AGE_HOURS: "24"
  ATTACHMENT_DOWNLOAD_URL_TTL_SECONDS: "300"
  OUTBOUND_EMAIL_ATTACHMENT_MAX_BYTES: "26214400"
  # El ingress de confianza debe sanear/añadir X-Forwarded-For.
  PUBLIC_CLIENT_IP_HEADER: "HTTP_X_FORWARDED_FOR"
  # Azure, Zendesk y SECRET_KEY vienen de SSM — no van aquí
