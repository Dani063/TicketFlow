apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketflow-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketflow
      role: worker
  template:
    metadata:
      labels:
        app: ticketflow
        role: worker
    spec:
      containers:
        - name: worker
          image: ticketflow:latest           # ← actualizar con tu registry/tag
          command: ["entrypoint.sh", "worker"]
          envFrom:
            - configMapRef:
                name: ticketflow-config
            - secretRef:
                name: ticketflow-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
