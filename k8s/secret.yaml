# TEMPLATE — NO subir al repo con valores reales.
#
# En producción SECRET_KEY y AZURE_CLIENT_SECRET se leen de AWS SSM automáticamente.
# Este Secret solo es necesario si el pod NO tiene acceso a SSM (entornos sin IAM).
#
# Crear con kubectl:
#   kubectl create secret generic ticketflow-secrets \
#     --from-literal=SECRET_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: ticketflow-secrets
type: Opaque
stringData:
  SECRET_KEY: "CHANGE-ME-long-random-secret-key"
  # AZURE_CLIENT_SECRET viene de SSM: /Recordia/.../AzureClientSecret
