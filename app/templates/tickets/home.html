<!-- templates/tickets/home.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TicketFlow</title>
    <link rel="stylesheet" type="text/css" href="{% static 'tickets/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="sidebar-navigation">
        <img src="{% static 'tickets/logo.png' %}" alt="Logo">
        <ul>
            <li class="active">
                <a href="{% url 'home' %}">
                    <i class="fas fa-home"></i>
                    <span class="tooltip">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{% url 'tickets_list' %}">
                    <i class="fas fa-list"></i>
                    <span class="tooltip">Views</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-users"></i>
                    <span class="tooltip">Customers</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-chart-bar"></i>
                    <span class="tooltip">Reporting</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fas fa-cog"></i>
                    <span class="tooltip">Admin</span>
                </a>
            </li>
        </ul>
    </div>
    <div class="content">
        <h1>Bienvenido a TicketFlow</h1>
        <ul>
            {% for ticket in tickets %}
            <li><a href="{% url 'ticket_detail' ticket.pk %}">{{ ticket.subject }}</a></li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
