<!-- templates/tickets/tickets_list.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TicketFlow</title>
    <link rel="stylesheet" type="text/css" href="{% static 'tickets/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="sidebar-navigation">
        <img src="{% static 'tickets/logo.png' %}" alt="Logo">
        <ul>
            <li>
                <a href="{% url 'home' %}">
                    <i class="fas fa-home"></i>
                    <span class="tooltip">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{% url 'tickets_list' %}">
                    <i class="fas fa-list"></i>
                    <span class="tooltip">Views</span>
                </a>
            </li>
            <li class="active">
                <a href="{% url 'customers_list' %}">
                    <i class="fas fa-users"></i>
                    <span class="tooltip">Customers</span>
                </a>
            </li>
            <li>
                <a href="{% url 'reporting' %}">
                    <i class="fas fa-chart-bar"></i>
                    <span class="tooltip">Reporting</span>
                </a>
            </li>
            <li>
                <a href="{% url 'settings' %}">
                    <i class="fas fa-cog"></i>
                    <span class="tooltip">Admin</span>
                </a>
            </li>
        </ul>
    </div>
    <nav class="navbar">
        <div class="navbar-left">
            <button class="add-tab">+ Add</button>
        </div>
        <div class="navbar-center">
            <input type="text" class="search-bar" placeholder="Buscar...">
        </div>
        <div class="navbar-right">
            <button class="notifications">
                <span class="icon">🔔</span>
                <span class="badge">3</span>
            </button>
            <div class="user-profile">
                <img src="{% static 'tickets/profile-pic.png' %}" alt="Perfil" class="profile-picture">
                <span class="username">Usuario</span>
            </div>
        </div>
    </nav>
    <div class="notifications-popup" id="notificationsPopup" style="display: none;">
        <div class="popup-header">
            <h2>Notificaciones</h2>
            <button class="close-popup" id="closePopup">X</button>
        </div>
        <div class="popup-content">
            <!-- Aquí se mostrarán las notificaciones -->
            <ul id="notificationsList">
                <!-- Las notificaciones se cargarán dinámicamente aquí -->
            </ul>
        </div>
    </div>
    <script>
        document.querySelector('.notifications').addEventListener('click', () => {
            const notificationsPopup = document.getElementById('notificationsPopup');
            const notificationsIcon = document.querySelector('.notifications');
            if (notificationsPopup.style.display === 'block') {
                notificationsPopup.style.display = 'none';
                notificationsIcon.classList.remove('active');
            } else {
                notificationsPopup.style.display = 'block';
                notificationsIcon.classList.add('active');
                loadNotifications();
            }
        });

        document.getElementById('closePopup').addEventListener('click', () => {
            document.getElementById('notificationsPopup').style.display = 'none';
            document.querySelector('.notifications').classList.remove('active');
        });

        function loadNotifications() {
            // Aquí puedes cargar las notificaciones del usuario, por ejemplo, haciendo una llamada AJAX
            const notifications = [
                'Notificación 1',
                'Notificación 2',
                'Notificación 3'
            ];

            const notificationsList = document.getElementById('notificationsList');
            notificationsList.innerHTML = '';
            notifications.forEach(notification => {
                const li = document.createElement('li');
                li.textContent = notification;
                notificationsList.appendChild(li);
            });
        }
    </script>
    <script>
        // Función para cargar las pestañas desde localStorage
        function loadTabs() {
            const tabs = JSON.parse(localStorage.getItem('tabs')) || [];
            tabs.forEach(tab => {
                addTab(tab.text, tab.url, false);
            });
        }

        // Función para guardar las pestañas en localStorage
        function saveTabs() {
            const tabs = [];
            document.querySelectorAll('.navbar-left .tab').forEach(tab => {
                tabs.push({ text: tab.innerText.replace(/\sX$/, ''), url: tab.dataset.url });
            });
            localStorage.setItem('tabs', JSON.stringify(tabs));
        }

        // Función para añadir una pestaña
        function addTab(text, url, select = true) {
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.dataset.url = url;

            const img = document.createElement('img');
            img.src = '{% static "tickets/logo.png" %}';
            img.alt = 'Icono';
            img.className = 'tab-icon';

            const tabText = document.createElement('span');
            tabText.className = 'tab-text';
            tabText.innerText = text;

            const closeButton = document.createElement('button');
            closeButton.innerText = 'X';
            closeButton.className = 'close-tab';
            closeButton.addEventListener('click', (e) => {
                e.stopPropagation();
                const nextTab = tab.nextElementSibling || tab.previousElementSibling;
                tab.remove();
                saveTabs();
            });

            tab.appendChild(img);
            tab.appendChild(tabText);
            tab.appendChild(closeButton);

            tab.addEventListener('click', () => {
                document.querySelectorAll('.navbar-left .tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                window.location.href = url;
            });

            document.querySelector('.navbar-left').appendChild(tab);
            if (select) {
                tab.click();
            }
            saveTabs();
        }

        // Evento para añadir una nueva pestaña
        document.querySelector('.add-tab').addEventListener('click', () => {
            const tabText = "Nuevo ticket";
            const tabId = `ticket-${Date.now()}`;
            addTab(tabText, `{% url "create_ticket" %}?id=${tabId}`);
        });

        // Función para marcar la pestaña activa
        function highlightActiveTab() {
            const urlParams = new URLSearchParams(window.location.search);
            const activeTabId = urlParams.get('id'); // Obtiene el ID del ticket de la URL

            if (activeTabId) {
                document.querySelectorAll('.navbar-left .tab').forEach(tab => {
                    if (tab.dataset.url.includes(`id=${activeTabId}`)) {
                        tab.classList.add('active'); // Marca la pestaña activa
                    } else {
                        tab.classList.remove('active'); // Quita la clase de las demás
                    }
                });
            }
        }

        // Llama a la función después de cargar las pestañas
        document.addEventListener('DOMContentLoaded', () => {
            loadTabs();
            highlightActiveTab();
        });
    </script>

    <div class="content">
        <h1>Usuarios</h1>
    </div>
</body>
</html>
