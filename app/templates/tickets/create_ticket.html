<!-- templates/tickets/crete_ticket.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TicketFlow</title>
    <link rel="stylesheet" type="text/css" href="{% static 'tickets/style.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'tickets/create_ticket.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- CSS de Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />

    <!-- JS de Select2 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
</head>
<body>
    <div class="sidebar-navigation">
        <img src="{% static 'tickets/logo.png' %}" alt="Logo">
        <ul>
            <li>
                <a href="{% url 'home' %}">
                    <i class="fas fa-home"></i>
                    <span class="tooltip">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{% url 'tickets_list' %}">
                    <i class="fas fa-list"></i>
                    <span class="tooltip">Views</span>
                </a>
            </li>
            <li>
                <a href="{% url 'customers_list' %}">
                    <i class="fas fa-users"></i>
                    <span class="tooltip">Customers</span>
                </a>
            </li>
            <li>
                <a href="{% url 'reporting' %}">
                    <i class="fas fa-chart-bar"></i>
                    <span class="tooltip">Reporting</span>
                </a>
            </li>
            <li>
                <a href="{% url 'settings' %}">
                    <i class="fas fa-cog"></i>
                    <span class="tooltip">Admin</span>
                </a>
            </li>
        </ul>
    </div>
    <nav class="navbar">
        <div class="navbar-left">
            <button class="add-tab">+ Add</button>
        </div>
        <div class="navbar-center">
            <input type="text" class="search-bar" placeholder="Buscar...">
        </div>
        <div class="navbar-right">
            <button class="notifications">
                <span class="icon">🔔</span>
                <span class="badge">3</span>
            </button>
            <div class="user-profile">
                <img src="{% static 'tickets/profile-pic.png' %}" alt="Perfil" class="profile-picture">
                <span class="username">Usuario</span>
            </div>
        </div>
    </nav>
    <div class="notifications-popup" id="notificationsPopup" style="display: none;">
        <div class="popup-header">
            <h2>Notificaciones</h2>
            <button class="close-popup" id="closePopup">X</button>
        </div>
        <div class="popup-content">
            <!-- Aquí se mostrarán las notificaciones -->
            <ul id="notificationsList">
                <!-- Las notificaciones se cargarán dinámicamente aquí -->
            </ul>
        </div>
    </div>
    <div class="user-popup" id="userPopup" style="display: none;">
        <div class="popup-header">
            <div class="user-info">
                <img src="{% static 'tickets/profile-pic.png' %}" alt="Perfil" class="profile-picture">
                <span class="username">Usuario</span>
                <a href="{% url 'profile' %}" class="view-profile">Ver perfil</a>
            </div>
        </div>
        <div class="popup-content">
            <button class="logout-button" id="logoutButton">Desloguearse</button>
        </div>
    </div>

    <script>
        document.querySelector('.user-profile').addEventListener('click', () => {
            const userPopup = document.getElementById('userPopup');
            const notificationsPopup = document.getElementById('notificationsPopup');
            const userProfileIcon = document.querySelector('.user-profile');
            const notificationsIcon = document.querySelector('.notifications');

            if (userPopup.style.display === 'block') {
                userPopup.style.display = 'none';
                userProfileIcon.classList.remove('active');
            } else {
                userPopup.style.display = 'block';
                userProfileIcon.classList.add('active');

                // Cerrar la ventana de notificaciones si está abierta
                if (notificationsPopup.style.display === 'block') {
                    notificationsPopup.style.display = 'none';
                    notificationsIcon.classList.remove('active');
                }
            }
        });

        document.getElementById('logoutButton').addEventListener('click', () => {
            // Aquí puedes añadir la lógica para desloguearse, por ejemplo, redirigir a la página de logout
            window.location.href = '{% url "login" %}';
        });

    </script>

    <script>
        document.querySelector('.notifications').addEventListener('click', () => {
            const notificationsPopup = document.getElementById('notificationsPopup');
            const userPopup = document.getElementById('userPopup');
            const notificationsIcon = document.querySelector('.notifications');
            const userProfileIcon = document.querySelector('.user-profile');

            if (notificationsPopup.style.display === 'block') {
                notificationsPopup.style.display = 'none';
                notificationsIcon.classList.remove('active');
            } else {
                notificationsPopup.style.display = 'block';
                notificationsIcon.classList.add('active');
                loadNotifications();

                // Cerrar la ventana de usuario si está abierta
                if (userPopup.style.display === 'block') {
                    userPopup.style.display = 'none';
                    userProfileIcon.classList.remove('active');
                }
            }
        });

        document.getElementById('closePopup').addEventListener('click', () => {
            document.getElementById('notificationsPopup').style.display = 'none';
            document.querySelector('.notifications').classList.remove('active');
        });

        function loadNotifications() {
            // Aquí puedes cargar las notificaciones del usuario, por ejemplo, haciendo una llamada AJAX
            const notifications = [
                'Notificación 1',
                'Notificación 2',
                'Notificación 3'
            ];

            const notificationsList = document.getElementById('notificationsList');
            notificationsList.innerHTML = '';
            notifications.forEach(notification => {
                const li = document.createElement('li');
                li.textContent = notification;
                notificationsList.appendChild(li);
            });
        }
    </script>
    <script>
        // Función para cargar las pestañas desde localStorage
        function loadTabs() {
            const tabs = JSON.parse(localStorage.getItem('tabs')) || [];
            tabs.forEach(tab => {
                addTab(tab.text, tab.url, false);
            });
        }

        // Función para guardar las pestañas en localStorage
        function saveTabs() {
            const tabs = [];
            document.querySelectorAll('.navbar-left .tab').forEach(tab => {
                tabs.push({ text: tab.innerText.replace(/\sX$/, ''), url: tab.dataset.url });
            });
            localStorage.setItem('tabs', JSON.stringify(tabs));
        }

        // Función para añadir una pestaña
        function addTab(text, url, select = true) {
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.dataset.url = url;

            const img = document.createElement('img');
            img.src = '{% static "tickets/logo.png" %}';
            img.alt = 'Icono';
            img.className = 'tab-icon';

            const tabText = document.createElement('span');
            tabText.className = 'tab-text';
            tabText.innerText = text;

            const closeButton = document.createElement('button');
            closeButton.innerText = 'X';
            closeButton.className = 'close-tab';
            closeButton.addEventListener('click', (e) => {
                e.stopPropagation();
                const nextTab = tab.nextElementSibling || tab.previousElementSibling;
                tab.remove();
                saveTabs();
                if (nextTab) {
                    window.location.href = nextTab.dataset.url;
                } else {
                    window.location.href = '{% url "tickets_list" %}';
                }
            });

            tab.appendChild(img);
            tab.appendChild(tabText);
            tab.appendChild(closeButton);

            tab.addEventListener('click', () => {
                document.querySelectorAll('.navbar-left .tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                window.location.href = url;
            });

            document.querySelector('.navbar-left').appendChild(tab);
            if (select) {
                tab.click();
            }
            saveTabs();
        }

        // Evento para añadir una nueva pestaña
        document.querySelector('.add-tab').addEventListener('click', () => {
            const tabText = "Nuevo ticket";
            const tabId = `ticket-${Date.now()}`;
            addTab(tabText, `{% url "create_ticket" %}?id=${tabId}`);
        });

        // Función para marcar la pestaña activa
        function highlightActiveTab() {
            const urlParams = new URLSearchParams(window.location.search);
            const activeTabId = urlParams.get('id'); // Obtiene el ID del ticket de la URL

            if (activeTabId) {
                document.querySelectorAll('.navbar-left .tab').forEach(tab => {
                    if (tab.dataset.url.includes(`id=${activeTabId}`)) {
                        tab.classList.add('active'); // Marca la pestaña activa
                    } else {
                        tab.classList.remove('active'); // Quita la clase de las demás
                    }
                });
            }
        }

        // Llama a la función después de cargar las pestañas
        document.addEventListener('DOMContentLoaded', () => {
            loadTabs();
            highlightActiveTab();
        });
    </script>
    <script>
        // Ejemplo de inicialización de un desplegable con búsqueda
        document.addEventListener('DOMContentLoaded', () => {
            const selectElements = document.querySelectorAll('select');
            selectElements.forEach(select => {
                // Inicializa el desplegable con búsqueda (puedes usar una librería como Select2)
                $(select).select2();
            });
        });

        // Ejemplo de manejo de creación de nuevos usuarios/tags
        document.getElementById('ccs').addEventListener('input', (event) => {
            const value = event.target.value;
            if (value.endsWith(',')) {
                // Lógica para crear un nuevo usuario
                const newUser = value.slice(0, -1);
                console.log('Crear nuevo usuario:', newUser);
                // Añadir el nuevo usuario a la lista de CCs
            }
        });

        document.getElementById('tags').addEventListener('change', (event) => {
            const value = event.target.value;
            if (value === 'create_new_tag') {
                // Lógica para crear un nuevo tag
                const newTag = prompt('Introduce el nuevo tag:');
                if (newTag) {
                    console.log('Crear nuevo tag:', newTag);
                    // Añadir el nuevo tag a la lista de tags
                }

    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Obtener el ID del ticket de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const ticketId = urlParams.get('id');

            // Inicializa Select2 para todos los campos de selección
            const selectElements = document.querySelectorAll('select');
            selectElements.forEach(select => {
                $(select).select2();
            });

            // Inicializa Select2 con la funcionalidad de creación de tags solo para el campo de "Tags"
            $('#tags').select2({
                tags: true,
                createTag: function (params) {
                    return {
                        id: 'create_new_tag',
                        text: 'Añadir tag: ' + params.term,
                        newTag: true // add additional parameters
                    };
                },
                templateResult: function (data) {
                    if (data.newTag) {
                        return $('<span class="add-tag-button">' + data.text + '</span>');
                    }
                    return data.text;
                }
            });

            // Manejo de creación de nuevos tags
            $('#tags').on('select2:select', function (e) {
                const data = e.params.data;
                if (data.id === 'create_new_tag') {
                    const newTag = data.text.replace('Añadir tag: ', '');
                    const isValidTag = /^[a-zA-Z0-9]+$/.test(newTag); // Verificar si el tag es válido
                    if (newTag && isValidTag) {
                        // Verificar si el tag ya existe en la lista
                        let exists = false;
                        $('#tags option').each(function () {
                            if ($(this).val() === newTag) {
                                exists = true;
                                return false; // salir del bucle
                            }
                        });

                        // Añadir el nuevo tag a la lista de tags si no existe
                        if (!exists) {
                            const newOption = new Option(newTag, newTag, true, true);
                            $('#tags').append(newOption).trigger('change');
                        }

                        // Eliminar la opción temporal "Añadir tag: ejemplo"
                        $('#tags').find('option[value="create_new_tag"]').remove();
                    } else {
                        alert('El tag solo puede contener letras y números, sin espacios en blanco.');
                        $('#tags').find('option[value="create_new_tag"]').remove();
                    }
                }
            });

            // Función para guardar los datos del formulario en localStorage
            function saveFormData() {
                const formData = {};
                selectElements.forEach(select => {
                    formData[select.id] = $(select).val();
                });
                localStorage.setItem(`ticketFormData_${ticketId}`, JSON.stringify(formData));
            }

            // Función para cargar los datos del formulario desde localStorage
            function loadFormData() {
                const formData = JSON.parse(localStorage.getItem(`ticketFormData_${ticketId}`));
                if (formData) {
                    selectElements.forEach(select => {
                        if (formData[select.id]) {
                            $(select).val(formData[select.id]).trigger('change');
                        }
                    });
                }
            }

            // Guardar los datos del formulario cuando se cambian
            selectElements.forEach(select => {
                $(select).on('change', saveFormData);
            });

            // Cargar los datos del formulario al cargar la página
            loadFormData();
        });
    </script>

    <div class="title-bar">
        <h1>Nuevo Ticket</h1>
    </div>
    <div class="ticket-form">
        <div class="column">
            <div class="form-group">
                <label for="empresa">Empresa</label>
                <select id="empresa" class="select2">
                    <option value="" disabled selected>-</option>
                    <option value="empresa1">Audio Simple Notification Service</option>
                    <option value="empresa2">Comunycarse Helpdesk</option>
                    <option value="empresa3">EcomFax</option>
                    <option value="empresa4">Recordia</option>
                </select>
            </div>
            <div class="form-group">
                <label for="solicitante">Solicitante</label>
                <select id="solicitante" class="select2">
                    <option value="" disabled selected>-</option>
                    {% for user in usuarios %}
                    <option value="{{ user.id }}">{{ user.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="asignado">Asignado</label>
                <select id="asignado" class="select2">
                    <option value="" disabled selected>-</option>
                    {% for user in agentes %}
                    <option value="{{ user.id }}">{{ user.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="ccs">CCs</label>
                <select id="ccs" class="select2" multiple>
                    {% for user in todos %}
                    <option value="{{ user.id }}">{{ user.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="tags">Tags</label>
                <select id="tags" class="select2" multiple>
                    {% for tag in tags %}
                    <option value="{{ tag.id }}">{{ tag.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" class="select2">
                        <option value="-" selected>-</option>
                        <option value="incidencia">Incidencia</option>
                        <option value="consulta">Consulta</option>
                        <option value="mejora">Problema</option>
                        <option value="tarea">Tarea</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="prioridad">Prioridad</label>
                    <select id="prioridad" class="select2">
                        <option value="-" selected>-</option>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="alta">Alta</option>
                        <option value="urgente">Urgente</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="servicio">Servicio</label>
                <select id="servicio" class="select2">
                    <option value="-">-</option>
                    <option value="ecomfax">EcomFax</option>
                    <option value="ecomfaxpro">EcomFaxPro</option>
                    <option value="recordia">Recordia</option>
                    <option value="aplicateca">Aplicateca</option>
                    <option value="audiolog">Audiolog</option>
                    <option value="cisco_telefonia">Cisco Telefonia</option>
                    <option value="rightfax">Rightfax</option>
                    <option value="internocomuny">InternoComuny</option>
                    <option value="rts">RTS</option>
                    <option value="otros" selected>Otros</option>
                    <option value="cognitia">Cognitia</option>
                </select>
            </div>
            <div class="form-group">
                <label for="canal">Canal</label>
                <select id="canal" class="select2">
                    <option value="-" selected>-</option>
                    <option value="email">Email</option>
                    <option value="telefono">Teléfono</option>
                    <option value="web">Web</option>
                    <option value="api">API</option>
                </select>
            </div>
            <div class="form-group">
                <label for="idioma">Idioma</label>
                <select id="idioma" class="select2">
                    <option value="es">Español</option>
                    <option value="en">Inglés</option>
                </select>
            </div>
            <div class="margin-bottom-large">
                <label for="categoria">Categoría</label>
                <select id="categoria" class="select2">
                    <option value="-" selected>-</option>
                    <option value="communication">Communication</option>
                    <option value="hardware">Hardware</option>
                    <option value="base_software">Base software</option>
                    <option value="app_functionality">App Functionality</option>
                    <option value="database">Database</option>
                    <option value="api">App Program Interface (API)</option>
                    <option value="webservice">WebService</option>
                    <option value="configuration">Configuration</option>
                    <option value="others">Others</option>
                    <option value="information">Information</option>
                </select>
            </div>
            <hr class="margin-bottom-large">
        </div>

        <div class="column2">
            <!-- Barra de Subject -->
            <div class="subject-bar">
                <h1>Subject</h1>
            </div>

            <!-- Cuadro de mensajes -->
            <div class="messages-box">
                <!-- Aquí se mostrarán los mensajes del ticket -->
                <div class="message">
                    <p><strong>Usuario:</strong> Mensaje de ejemplo</p>
                    <span class="timestamp">2023-10-01 12:00</span>
                </div>
            </div>

            <div class="message-input">
                <textarea id="new-message" placeholder="Escribe un mensaje..."></textarea>
                <button id="send-message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
