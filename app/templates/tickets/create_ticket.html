<!-- app/templates/tickets/create_ticket.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TicketFlow</title>
    <link rel="stylesheet" type="text/css" href="{% static 'tickets/style.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'tickets/create_ticket.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- CSS de Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />
    <!-- JS de Select2 y jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
</head>
<body>
    <!-- Sidebar de Navegación -->
    <div class="sidebar-navigation">
        <img src="{% static 'tickets/logo.png' %}" alt="Logo">
        <ul>
            <li>
                <a href="{% url 'home' %}">
                    <i class="fas fa-home"></i>
                    <span class="tooltip">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{% url 'tickets_list' %}">
                    <i class="fas fa-list"></i>
                    <span class="tooltip">Views</span>
                </a>
            </li>
            <li>
                <a href="{% url 'customers_list' %}">
                    <i class="fas fa-users"></i>
                    <span class="tooltip">Customers</span>
                </a>
            </li>
            <li>
                <a href="{% url 'reporting' %}">
                    <i class="fas fa-chart-bar"></i>
                    <span class="tooltip">Reporting</span>
                </a>
            </li>
            <li>
                <a href="{% url 'settings' %}">
                    <i class="fas fa-cog"></i>
                    <span class="tooltip">Admin</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Barra de Navegación -->
    <nav class="navbar">
        <div class="navbar-left">
            <button class="add-tab">+ Add</button>
        </div>
        <div class="navbar-center">
            <input type="text" class="search-bar" placeholder="Buscar...">
        </div>
        <div class="navbar-right">
            <button class="notifications">
                <span class="icon">🔔</span>
                <span class="badge">3</span>
            </button>
            <div class="user-profile">
                <img src="{% static 'tickets/profile-pic.png' %}" alt="Perfil" class="profile-picture">
                <span class="username">{{ username }}</span>
            </div>
        </div>
    </nav>

    <!-- Popup de Notificaciones -->
    <div class="notifications-popup" id="notificationsPopup" style="display: none;">
        <div class="popup-header">
            <h2>Notificaciones</h2>
            <button class="close-popup" id="closePopup">X</button>
        </div>
        <div class="popup-content">
            <ul id="notificationsList">
                <!-- Notificaciones dinámicas -->
            </ul>
        </div>
    </div>

    <!-- Popup de Usuario -->
    <div class="user-popup" id="userPopup" style="display: none;">
        <div class="popup-header">
            <div class="user-info">
                <img src="{% static 'tickets/profile-pic.png' %}" alt="Perfil" class="profile-picture">
                <span class="username">{{ username }}</span>
                <span class="username">{{ email }}</span>
                <a href="{% url 'profile' %}" class="view-profile">Ver perfil</a>
            </div>
        </div>
        <div class="popup-content">
            <button class="logout-button" id="logoutButton">Desloguearse</button>
        </div>
    </div>

    <!-- Barra de Título -->
    <div class="title-bar">
        <h1>Nuevo Ticket</h1>
    </div>

    <!-- Formulario de Creación de Ticket -->
    <form id="ticket-form" method="post" action="{% url 'create_ticket' %}">
        {% csrf_token %}
        <div class="ticket-form">
            <div class="column">
                <!-- Campos del Formulario -->
                <div class="form-group">
                    <label for="empresa">Empresa</label>
                    <select id="empresa" name="empresa" class="select2">
                        <option value="" disabled selected>-</option>
                        <option value="Audio Simple Notification Service">Audio Simple Notification Service</option>
                        <option value="Comunycarse Helpdesk">Comunycarse Helpdesk</option>
                        <option value="EcomFax">EcomFax</option>
                        <option value="Recordia">Recordia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="solicitante">Solicitante</label>
                    <select id="solicitante" name="solicitante" class="select2">
                        <option value="" disabled selected>-</option>
                        {% for user in usuarios %}
                        <option value="{{ user.id }}">{{ user.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="asignado">Asignado</label>
                    <select id="asignado" name="asignado" class="select2">
                        <option value="" disabled selected>-</option>
                        {% for user in agentes %}
                        <option value="{{ user.id }}">{{ user.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="ccs">CCs</label>
                    <select id="ccs" name="ccs" class="select2" multiple>
                        {% for user in usuarios %}
                        <option value="{{ user.id }}">{{ user.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="tags">Tags</label>
                    <select id="tags" name="tags" class="select2" multiple>
                        {% for tag in tags %}
                        <option value="{{ tag.id }}">{{ tag.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="tipo">Tipo</label>
                        <select id="tipo" name="tipo" class="select2">
                            <option value="-" selected>-</option>
                            <option value="incidencia">Incidencia</option>
                            <option value="consulta">Consulta</option>
                            <option value="mejora">Problema</option>
                            <option value="tarea">Tarea</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prioridad">Prioridad</label>
                        <select id="prioridad" name="prioridad" class="select2">
                            <option value="-" selected>-</option>
                            <option value="baja">Baja</option>
                            <option value="media">Media</option>
                            <option value="alta">Alta</option>
                            <option value="urgente">Urgente</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="servicio">Servicio</label>
                    <select id="servicio" name="servicio" class="select2">
                        <option value="-">-</option>
                        <option value="ecomfax">EcomFax</option>
                        <option value="ecomfaxpro">EcomFaxPro</option>
                        <option value="recordia">Recordia</option>
                        <option value="aplicateca">Aplicateca</option>
                        <option value="audiolog">Audiolog</option>
                        <option value="cisco_telefonia">Cisco Telefonia</option>
                        <option value="rightfax">Rightfax</option>
                        <option value="internocomuny">InternoComuny</option>
                        <option value="rts">RTS</option>
                        <option value="otros" selected>Otros</option>
                        <option value="cognitia">Cognitia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="canal">Canal</label>
                    <select id="canal" name="canal" class="select2">
                        <option value="-" selected>-</option>
                        <option value="email">Email</option>
                        <option value="telefono">Teléfono</option>
                        <option value="web">Web</option>
                        <option value="api">API</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="idioma">Idioma</label>
                    <select id="idioma" name="idioma" class="select2">
                        <option value="es">Español</option>
                        <option value="en">Inglés</option>
                    </select>
                </div>
                <div class="margin-bottom-large">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" class="select2">
                        <option value="-" selected>-</option>
                        <option value="communication">Communication</option>
                        <option value="hardware">Hardware</option>
                        <option value="base_software">Base software</option>
                        <option value="app_functionality">App Functionality</option>
                        <option value="database">Database</option>
                        <option value="api">App Program Interface (API)</option>
                        <option value="webservice">WebService</option>
                        <option value="configuration">Configuration</option>
                        <option value="others">Others</option>
                        <option value="information">Information</option>
                    </select>
                </div>
                <hr class="margin-bottom-large">
            </div>

            <div class="column2">
                <!-- Barra de Subject -->
                <div class="subject-bar">
                    <input type="text" id="subject" name="subject" placeholder="Subject">
                </div>

                <!-- Cuadro de Mensajes -->
                <div class="messages-box">
                    <div class="message">
                        <p><strong>Usuario:</strong> Mensaje de ejemplo</p>
                        <span class="timestamp">2023-10-01 12:00</span>
                    </div>
                </div>

                <!-- Input de Mensaje -->
                <div class="message-input">
                    <textarea id="new-message" name="content" placeholder="Escribe un mensaje..."></textarea>
                </div>
            </div>
        </div>

        <!-- Barra de Pie de Formulario -->
        <div class="footer-bar">
            <div class="footer-right">
                <button type="button" id="publish-button" class="main-btn">Publicar como <span id="selected-status">New</span></button>
                <button id="dropdown-button" class="dropdown-btn"><i class="fas fa-caret-down"></i></button>
                <div id="dropdown-content" class="dropdown-content">
                    <a href="#" data-status="New">New</a>
                    <a href="#" data-status="Open">Open</a>
                    <a href="#" data-status="Pending">Pending</a>
                    <a href="#" data-status="On-hold">On-hold</a>
                    <a href="#" data-status="Solved">Solved</a>
                </div>
            </div>
        </div>
    </form>
    <script>
        window.urls = {
            create_ticket: "{% url 'create_ticket' %}",
            tickets_list: "{% url 'tickets_list' %}",
            login: "{% url 'login' %}",
            /* Añade otras URLs necesarias */
        };
        window.static_urls = {
            logo: "{% static 'tickets/logo.png' %}",
            /* Otras rutas estáticas si es necesario */
        };
    </script>
    <script src="{% static 'tickets/create_ticket.js' %}"></script>
</body>
</html>
